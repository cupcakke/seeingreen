[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-uq"
version = "1.0.0"
description = "Auditable uncertainty quantification and confidence calibration for language models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Epistemic UQ Contributors"}]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2.0,<4",
  "pyyaml>=6.0,<7",
  "redis>=5.1,<6",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=3.1,<4",
  "torch>=2.4,<3",
  "transformers>=4.45,<5"
]
test = [
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<6",
  "pytest-timeout>=2.3,<3"
]

[project.scripts]
epistemic-uq = "epistemic_uq.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epistemic_uq = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration"]

[tool.coverage.run]
branch = true
source = ["epistemic_uq"]

[tool.coverage.report]
fail_under = 85
show_missing = true
